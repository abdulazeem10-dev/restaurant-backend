<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Restaurant dashboard | Food Platform</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body><header><h1>Restaurant Dashboard</h1><nav><a href="../customer/index.html">Customer site</a><button id="logout" class="secondary">Log out</button></nav></header><main>
<p id="message" role="status"></p><section class="panel"><h2 id="restaurant-title">Your restaurant</h2><p id="restaurant-state"></p><button id="open-toggle" type="button" hidden></button><h2>Menu</h2><form id="menu-form" class="form-grid"><label>Item name<br><input name="name" required maxlength="150"></label><label>Category<br><input name="category" required maxlength="80" placeholder="Mains"></label><label>Price in rupees<br><input name="price" type="number" min="0.01" step="0.01" required></label><label>Description<br><input name="description" maxlength="1000"></label><label>Dish image URL (HTTPS)<br><input name="imageUrl" type="url" maxlength="2048" placeholder="https://…"></label><button type="submit">Add menu item</button></form><p class="muted">Paste a publicly accessible image link. The image itself must be hosted online.</p><div id="menu-items" class="grid"></div></section>
<section><h2>Incoming orders</h2><div id="orders" class="grid"></div></section></main><script src="../assets/js/common.js"></script><script src="../assets/js/restaurant.js"></script></body></html>
