<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Restaurant menu | Foodway</title><link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/foodway-theme.css"></head>
<body class="customer-page">
  <header class="site-header">
    <a class="wordmark" href="index.html"><span class="wordmark-icon">F</span><span>Foodway</span></a>
    <nav class="site-nav" aria-label="Main navigation"><a href="index.html">Restaurants</a><a href="orders.html">Orders</a><a href="cart.html" class="cart-link">Cart <span data-cart-count>0</span></a><a href="login.html" class="login-link">Log in</a></nav>
  </header>
  <main class="storefront-main">
    <p class="breadcrumbs"><a href="index.html">Restaurants</a><span aria-hidden="true">/</span><span id="crumb-name">Menu</span></p>
    <section class="storefront-hero" aria-busy="true">
      <div class="storefront-art" aria-hidden="true"><svg class="storefront-bowl-art" viewBox="0 0 240 180" role="presentation"><defs><linearGradient id="bowl-fill" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e8a24b"/><stop offset="1" stop-color="#cf6442"/></linearGradient></defs><ellipse cx="120" cy="125" rx="82" ry="20" fill="#89553b" opacity=".13"/><path d="M45 82h150c-4 46-29 68-75 68S49 128 45 82Z" fill="url(#bowl-fill)"/><ellipse cx="120" cy="82" rx="75" ry="25" fill="#fff4d8"/><ellipse cx="120" cy="83" rx="60" ry="17" fill="#efbd63"/><g fill="#fff8e7"><ellipse cx="86" cy="79" rx="12" ry="4" transform="rotate(-18 86 79)"/><ellipse cx="113" cy="72" rx="13" ry="4" transform="rotate(11 113 72)"/><ellipse cx="140" cy="79" rx="13" ry="4" transform="rotate(-13 140 79)"/><ellipse cx="160" cy="84" rx="11" ry="4" transform="rotate(17 160 84)"/></g><g fill="#4f8756"><path d="M90 91c-10-13 0-20 12-15-2 9-6 14-12 15Z"/><path d="M140 91c-7-12 2-18 13-12-3 8-7 12-13 12Z"/></g><path d="M75 149c25 13 65 13 90 0" fill="none" stroke="#ba583e" stroke-linecap="round" stroke-width="5" opacity=".45"/><path d="M93 43c-8-10 8-14 0-24m28 24c-8-10 8-14 0-24m28 24c-8-10 8-14 0-24" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5" opacity=".8"/></svg><i>✦</i><b>♡</b></div>
      <div class="storefront-info"><p class="eyebrow">LOCAL RESTAURANT</p><h1 id="restaurant-name">Loading restaurant…</h1><p id="restaurant-description" class="muted"></p><p id="restaurant-address" class="storefront-address"></p><span id="restaurant-status" class="open-badge"></span><p id="restaurant-hours" class="muted"></p><p id="restaurant-delivery-area" class="muted"></p></div>
    </section>
    <section class="menu-header"><div><p class="eyebrow">FRESH FROM THE KITCHEN</p><h2>Explore the menu</h2></div><div class="menu-header-actions"><div class="menu-food-filter"><span>Show dishes</span><div class="quick-food-filters menu-food-pills" role="group" aria-label="Filter dishes by food type"><button type="button" data-menu-food="all" aria-pressed="true">All dishes</button><button type="button" data-menu-food="veg" aria-pressed="false"><span aria-hidden="true">●</span> Veg only</button><button type="button" data-menu-food="nonVeg" aria-pressed="false"><span aria-hidden="true">●</span> Non-Veg only</button></div></div><a class="back-link" href="index.html">← All restaurants</a></div></section>
    <nav id="category-nav" class="category-nav" aria-label="Menu categories"></nav>
    <p id="error" class="error-message" role="alert"></p>
    <div class="menu-layout"><section id="menu-items" class="menu-list" aria-live="polite"></section><aside class="menu-cart-card"><span class="cart-card-icon" aria-hidden="true">🛍️</span><h3>Your order</h3><p id="cart-summary" class="muted">Your cart is empty</p><p id="cart-feedback" class="cart-feedback" role="status" aria-live="polite" aria-atomic="true"></p><a class="card-action" href="cart.html">Go to cart <span aria-hidden="true">→</span></a></aside></div>
    <section class="reviews-section" aria-labelledby="reviews-title"><div class="reviews-heading"><div><p class="eyebrow">CUSTOMER FEEDBACK</p><h2 id="reviews-title">Ratings &amp; reviews</h2></div><p id="review-summary" class="muted">Loading reviews…</p></div><div id="restaurant-reviews" class="reviews-list" aria-live="polite"></div></section>
  </main>
  <script src="../assets/js/common.js"></script><script src="../assets/js/menu.js"></script>
</body></html>
