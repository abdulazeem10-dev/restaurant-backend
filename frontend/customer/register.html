<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | Foodway</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body class="customer-page auth-page"><header class="auth-header"><a class="wordmark" href="index.html"><span class="wordmark-icon">F</span><span>Foodway</span></a><a href="index.html">Back to restaurants</a></header><main><h2>Create a customer account</h2><form id="register-form"><p><label>Name<br><input name="name" required maxlength="100" autocomplete="name"></label></p><p><label>Email<br><input name="email" type="email" required autocomplete="email"></label></p><p><label>Phone number (include country code)<br><input name="phone" type="tel" required minlength="8" maxlength="25" placeholder="+91 98765 43210" autocomplete="tel"></label></p><p><label>Password (at least 12 characters)<br><input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label></p><button type="submit">Create account</button></form><p class="auth-divider">or continue with</p><div id="google-signin-button"></div><p id="message" role="status"></p><p>Already have an account? <a href="login.html">Sign in</a>.</p></main><script src="../assets/js/common.js"></script><script src="../assets/js/google-auth.js"></script><script>
document.querySelector("#register-form").addEventListener("submit", async event => {
  event.preventDefault(); const message = document.querySelector("#message"); const registerForm = event.currentTarget; const form = new FormData(registerForm); message.textContent = "Creating account…";
  try {
    const response = await fetch(`${API_BASE}/auth/register`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: form.get("name"), email: form.get("email"), phone: form.get("phone"), password: form.get("password") }) });
    const data = await response.json(); if (!response.ok) throw new Error(data.error || "Unable to create account");
    message.textContent = "Account created. Please sign in."; registerForm.reset();
  } catch (error) { message.textContent = error.message; }
});
renderGoogleSignInButton();
</script></body></html>
