<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | Food Platform</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header><h1>Food Platform</h1><a href="login.html">Back to login</a></header>
<main>
  <h2>Forgot password?</h2>
  <p>Enter the email address for your account. If it is registered, we’ll email you a reset link.</p>
  <form id="reset-request-form">
    <p><label>Email<br><input type="email" name="email" required autocomplete="email"></label></p>
    <button type="submit">Send reset link</button>
  </form>
  <p id="message" role="status"></p>
</main>
<script src="../assets/js/common.js"></script>
<script>
document.querySelector("#reset-request-form").addEventListener("submit", async event => {
  event.preventDefault();
  const message = document.querySelector("#message");
  const email = new FormData(event.currentTarget).get("email");
  message.textContent = "Sending…";

  try {
    const response = await fetch(`${API_BASE}/auth/password-reset/request`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to request a reset link");
    message.textContent = data.message;
    event.currentTarget.reset();
  } catch (error) {
    message.textContent = error.message;
  }
});
</script>
</body>
</html>
